<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公众号发布助手</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --border: rgba(0,0,0,0.08);
    --border-med: rgba(0,0,0,0.15);
    --text: #1a1a1a;
    --text-2: #666;
    --text-3: #999;
    --accent: #1a1a1a;
    --accent-light: #f0f0ec;
    --green: #2d8a4e;
    --green-bg: #eaf4ee;
    --red: #c0392b;
    --red-bg: #fdf0ef;
    --blue: #1a5faa;
    --blue-bg: #eef4fb;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body { height: 100%; background: var(--bg); font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; }

  /* ── Layout ── */
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); }

  /* ── Header ── */
  .header {
    background: var(--card);
    border-bottom: 0.5px solid var(--border);
    padding: 0;
    display: flex;
    position: sticky; top: 0; z-index: 50;
  }
  .tab-btn {
    flex: 1; padding: 14px 0; font-size: 14px; font-weight: 500;
    color: var(--text-3); background: none; border: none;
    border-bottom: 2px solid transparent; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

  /* ── Scrollable content ── */
  .page { display: none; flex: 1; overflow-y: auto; padding-bottom: 100px; }
  .page.active { display: block; }

  /* ── Cards / Sections ── */
  .section { background: var(--card); margin: 12px 16px; border-radius: var(--radius); border: 0.5px solid var(--border); overflow: hidden; }
  .section-header {
    padding: 12px 16px 8px;
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 0.5px solid var(--border);
  }

  /* ── Account selector ── */
  .account-pick {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; cursor: pointer; background: var(--card);
    transition: background 0.1s;
  }
  .account-pick:active { background: var(--accent-light); }
  .avatar {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; flex-shrink: 0;
  }
  .account-pick .info { flex: 1; min-width: 0; }
  .account-pick .info .name { font-size: 14px; font-weight: 500; color: var(--text); }
  .account-pick .info .id { font-size: 12px; color: var(--text-3); margin-top: 2px; font-family: 'SF Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-pick .arrow { color: var(--text-3); font-size: 18px; }
  .no-account { padding: 16px; color: var(--text-3); font-size: 13px; text-align: center; }

  /* ── Cover upload ── */
  .cover-area { padding: 14px 16px; }
  .cover-drop {
    border: 1.5px dashed var(--border-med);
    border-radius: var(--radius-sm);
    height: 110px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; color: var(--text-3); transition: border-color 0.15s, background 0.15s;
  }
  .cover-drop:hover { border-color: var(--text-2); background: var(--accent-light); }
  .cover-drop svg { width: 28px; height: 28px; opacity: 0.5; }
  .cover-drop span { font-size: 13px; }
  .cover-preview {
    border-radius: var(--radius-sm); height: 110px;
    background: #ddd; display: none; position: relative; overflow: hidden;
  }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-preview .rm-btn {
    position: absolute; top: 8px; right: 8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,0.55); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .cover-preview .rm-btn svg { width: 14px; height: 14px; }

  /* ── Text inputs ── */
  .field { padding: 14px 16px; border-bottom: 0.5px solid var(--border); }
  .field:last-child { border-bottom: none; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .field input, .field textarea {
    width: 100%; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text); font-family: inherit; resize: none;
    line-height: 1.6;
  }
  .field textarea { min-height: 180px; }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-3); }
  .char-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .char-count { font-size: 12px; color: var(--text-3); }

  /* ── Publish mode selector ── */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; }
  .mode-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 10px; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .mode-card.selected { border-color: var(--text); background: var(--accent-light); }
  .mode-card .mode-icon { font-size: 22px; margin-bottom: 6px; }
  .mode-card .mode-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .mode-card .mode-desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.4; }

  /* ── Bottom bar ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--card); border-top: 0.5px solid var(--border);
    padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .btn-pub {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-pub:active { opacity: 0.85; transform: scale(0.98); }
  .btn-pub:disabled { opacity: 0.4; }
  .btn-pub svg { width: 18px; height: 18px; }

  /* ── Config page ── */
  .cfg-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .cfg-bar h2 { font-size: 15px; font-weight: 600; }
  .btn-add {
    display: flex; align-items: center; gap: 5px;
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid var(--border-med); background: none;
    font-size: 13px; color: var(--text-2); cursor: pointer; font-family: inherit;
    transition: background 0.1s;
  }
  .btn-add:active { background: var(--accent-light); }

  .acct-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.1s;
  }
  .acct-item:last-child { border-bottom: none; }
  .acct-item:active { background: var(--accent-light); }
  .acct-item .info { flex: 1; min-width: 0; }
  .acct-item .info .name { font-size: 14px; font-weight: 500; color: var(--text); }
  .acct-item .info .appid { font-size: 12px; color: var(--text-3); font-family: 'SF Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; white-space: nowrap;
  }
  .badge-default { background: #e8f5e9; color: #2d6a4f; }
  .badge-normal { background: var(--accent-light); color: var(--text-3); }
  .acct-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: none; background: none; cursor: pointer; color: var(--text-3);
    display: flex; align-items: center; justify-content: center; transition: background 0.1s;
  }
  .icon-btn:hover { background: var(--accent-light); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }
  .tip-box {
    margin: 0 16px 16px; padding: 12px 14px;
    background: var(--blue-bg); border-radius: var(--radius-sm);
    font-size: 12px; color: var(--blue); line-height: 1.7;
  }

  /* ── Bottom sheet (modal) ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--card); border-radius: 20px 20px 0 0;
    padding: 20px 20px max(28px, env(safe-area-inset-bottom));
    width: 100%; max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
  .sheet-field { margin-bottom: 16px; }
  .sheet-field label { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 6px; font-weight: 500; }
  .sheet-field input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--border-med); border-radius: var(--radius-sm);
    font-size: 14px; color: var(--text); outline: none; font-family: inherit;
    transition: border-color 0.15s;
  }
  .sheet-field input:focus { border-color: var(--text); }
  .sheet-field input[type=password] { font-family: 'SF Mono', monospace; }
  .sheet-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
  .btn-cancel {
    padding: 13px; border: 1px solid var(--border-med); border-radius: var(--radius);
    background: none; font-size: 14px; color: var(--text-2); cursor: pointer; font-family: inherit;
  }
  .btn-save {
    padding: 13px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-save:disabled { opacity: 0.5; }

  /* ── Picker sheet ── */
  .picker-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 0;
    border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.1s;
  }
  .picker-item:last-child { border-bottom: none; }
  .picker-item:active { background: var(--accent-light); border-radius: var(--radius-sm); }
  .picker-item .pinfo { flex: 1; min-width: 0; }
  .picker-item .pname { font-size: 14px; font-weight: 500; }
  .picker-item .paid { font-size: 12px; color: var(--text-3); font-family: 'SF Mono', monospace; }
  .check-icon { color: var(--green); opacity: 0; }
  .check-icon.visible { opacity: 1; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: rgba(20,20,20,0.88); color: #fff;
    padding: 9px 20px; border-radius: 22px; font-size: 13px;
    z-index: 200; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Status badge on toast ── */
  .toast.success { background: rgba(45,138,78,0.92); }
  .toast.error { background: rgba(192,57,43,0.92); }

  /* ── Loading spinner ── */
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Progress steps ── */
  .progress-wrap { padding: 16px; display: none; }
  .progress-wrap.visible { display: block; }
  .step-list { display: flex; flex-direction: column; gap: 0; }
  .step-item {
    display: flex; align-items: flex-start; gap: 12px; padding: 10px 0;
    border-bottom: 0.5px solid var(--border); position: relative;
  }
  .step-item:last-child { border-bottom: none; }
  .step-dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; margin-top: 1px;
    transition: all 0.3s;
  }
  .step-dot.wait { background: var(--accent-light); color: var(--text-3); border: 1px solid var(--border-med); }
  .step-dot.running { background: var(--blue-bg); color: var(--blue); border: 1px solid #b3cde8; }
  .step-dot.done { background: var(--green-bg); color: var(--green); border: 1px solid #b3d9c0; }
  .step-dot.err { background: var(--red-bg); color: var(--red); border: 1px solid #f0c0bc; }
  .step-info .step-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .step-info .step-msg { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .step-info .step-msg.err { color: var(--red); }
</style>
</head>
<body>
<div id="app">
  <!-- Header tabs -->
  <div class="header">
    <button class="tab-btn active" onclick="switchTab('publish')">发布文章</button>
    <button class="tab-btn" onclick="switchTab('config')">公众号配置</button>
  </div>

  <!-- ══════════════ Publish Page ══════════════ -->
  <div class="page active" id="page-publish">

    <!-- Account selector -->
    <div class="section" style="margin-top:16px;">
      <div class="section-header">目标公众号</div>
      <div id="acct-selector"></div>
    </div>

    <!-- Cover image -->
    <div class="section">
      <div class="section-header">封面图片</div>
      <div class="cover-area">
        <div class="cover-drop" id="cover-drop" onclick="document.getElementById('file-input').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 16l4-4 4 4 4-6 4 6M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>点击选择封面图片</span>
        </div>
        <div class="cover-preview" id="cover-preview">
          <img id="cover-img" src="" alt="封面预览">
          <button class="rm-btn" onclick="removeCover()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
      </div>
    </div>

    <!-- Article fields -->
    <div class="section">
      <div class="field">
        <label>文章标题 *</label>
        <input type="text" id="art-title" placeholder="请输入文章标题" maxlength="64">
      </div>
      <div class="field">
        <label>作者</label>
        <input type="text" id="art-author" placeholder="选填">
      </div>
      <div class="field">
        <label>摘要</label>
        <input type="text" id="art-digest" placeholder="选填，默认取正文前 54 字">
      </div>
      <div class="field">
        <label>正文内容 *</label>
        <textarea id="art-content" placeholder="粘贴文章正文…支持 HTML 格式" oninput="countChars()"></textarea>
        <div class="char-row">
          <span class="char-count" id="char-count">0 字</span>
          <span class="char-count" style="font-size:11px;">支持 HTML</span>
        </div>
      </div>
    </div>

    <!-- Publish mode -->
    <div class="section">
      <div class="section-header">发布方式</div>
      <div class="mode-grid">
        <div class="mode-card selected" id="mode-draft" onclick="selectMode('draft')">
          <div class="mode-icon">📝</div>
          <div class="mode-name">保存草稿</div>
          <div class="mode-desc">存入草稿箱，手动审核后发布</div>
        </div>
        <div class="mode-card" id="mode-mass" onclick="selectMode('mass')">
          <div class="mode-icon">📣</div>
          <div class="mode-name">立即群发</div>
          <div class="mode-desc">直接推送给所有关注者</div>
        </div>
      </div>
    </div>

    <!-- Progress steps (shows during publishing) -->
    <div class="section">
      <div class="progress-wrap" id="progress-wrap">
        <div class="step-list" id="step-list"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════ Config Page ══════════════ -->
  <div class="page" id="page-config">
    <div class="cfg-bar">
      <h2>已配置公众号</h2>
      <button class="btn-add" onclick="openAddSheet()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        新增
      </button>
    </div>
    <div class="section">
      <div id="cfg-list"></div>
    </div>
    <div class="tip-box">
      🔒 AppSecret 仅保存在本地浏览器（localStorage），不会上传到任何服务器。发布时由你的后端中转换取 access_token。
    </div>
  </div>

  <!-- Bottom publish button -->
  <div class="bottom-bar" id="bottom-bar-publish">
    <button class="btn-pub" id="btn-pub" onclick="doPublish()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      发布文章
    </button>
  </div>
</div>

<!-- ══ Add/Edit account bottom sheet ══ -->
<div class="overlay" id="sheet-overlay" onclick="closeSheetOutside(event)">
  <div class="sheet">
    <div class="sheet-title" id="sheet-title">添加公众号</div>
    <div class="sheet-field">
      <label>公众号名称</label>
      <input type="text" id="inp-name" placeholder="便于识别的名称">
    </div>
    <div class="sheet-field">
      <label>AppID</label>
      <input type="text" id="inp-appid" placeholder="wxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="sheet-field">
      <label>AppSecret</label>
      <input type="password" id="inp-secret" placeholder="32位密钥">
      <div class="sheet-hint">仅本地存储，不明文传输</div>
    </div>
    <div class="sheet-field" id="field-backend">
      <label>后端地址</label>
      <input type="text" id="inp-backend" placeholder="http://localhost:3000" value="http://localhost:3000">
      <div class="sheet-hint">你的 Node.js 代理服务地址</div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">取消</button>
      <button class="btn-save" id="btn-save" onclick="saveAccount()">保存</button>
    </div>
  </div>
</div>

<!-- ══ Account picker sheet ══ -->
<div class="overlay" id="picker-overlay" onclick="closePickerOutside(event)">
  <div class="sheet">
    <div class="sheet-title">选择目标公众号</div>
    <div id="picker-list"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────
let accounts = JSON.parse(localStorage.getItem('wx_accounts') || '[]');
let selectedAcct = null;
let publishMode = 'draft';
let coverFile = null;
let editingIdx = -1;

// Avatar color palette
const COLORS = [
  ['#dbeafe','#1e40af'], ['#dcfce7','#166534'], ['#fce7f3','#9d174d'],
  ['#fff7ed','#9a3412'], ['#f3e8ff','#6b21a8'], ['#e0f2fe','#0c4a6e']
];

function getColor(i) { return COLORS[i % COLORS.length]; }

// ── Tab switching ──────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (tab==='publish'&&i===0)||(tab==='config'&&i===1)));
  document.getElementById('page-publish').classList.toggle('active', tab==='publish');
  document.getElementById('page-config').classList.toggle('active', tab==='config');
  document.getElementById('bottom-bar-publish').style.display = tab==='publish' ? '' : 'none';
  if (tab==='config') renderConfig();
}

// ── Accounts ───────────────────────────────────────────────────────
function saveAccounts() { localStorage.setItem('wx_accounts', JSON.stringify(accounts)); }

function renderSelector() {
  const el = document.getElementById('acct-selector');
  if (accounts.length === 0) {
    el.innerHTML = `<div class="no-account">暂无公众号，请先在「公众号配置」中添加</div>`;
    selectedAcct = null;
    return;
  }
  if (!selectedAcct) selectedAcct = accounts[0];
  const a = selectedAcct;
  const idx = accounts.indexOf(a);
  const [bg, fg] = getColor(idx);
  el.innerHTML = `
    <div class="account-pick" onclick="openPicker()">
      <div class="avatar" style="background:${bg};color:${fg}">${a.name[0]}</div>
      <div class="info">
        <div class="name">${a.name}</div>
        <div class="id">${a.appid}</div>
      </div>
      <div class="arrow">›</div>
    </div>`;
}

function renderConfig() {
  const el = document.getElementById('cfg-list');
  if (accounts.length === 0) {
    el.innerHTML = `<div class="no-account" style="padding:20px">还没有配置公众号</div>`;
    return;
  }
  el.innerHTML = accounts.map((a,i) => {
    const [bg, fg] = getColor(i);
    return `<div class="acct-item">
      <div class="avatar" style="background:${bg};color:${fg}">${a.name[0]}</div>
      <div class="info">
        <div class="name">${escHtml(a.name)}</div>
        <div class="appid">${escHtml(a.appid)}</div>
      </div>
      <span class="badge ${i===0?'badge-default':'badge-normal'}">${i===0?'默认':'备用'}</span>
      <div class="acct-actions">
        <button class="icon-btn" title="编辑" onclick="editAccount(${i})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15.232 5.232l3.536 3.536-9.9 9.9H5.268v-3.5l9.964-9.936z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" title="删除" onclick="deleteAccount(${i})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Open / close sheets ────────────────────────────────────────────
function openAddSheet() {
  editingIdx = -1;
  document.getElementById('sheet-title').textContent = '添加公众号';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-appid').value = '';
  document.getElementById('inp-secret').value = '';
  document.getElementById('inp-backend').value = 'http://localhost:3000';
  document.getElementById('btn-save').textContent = '保存';
  document.getElementById('sheet-overlay').classList.add('open');
}

function editAccount(i) {
  editingIdx = i;
  const a = accounts[i];
  document.getElementById('sheet-title').textContent = '编辑公众号';
  document.getElementById('inp-name').value = a.name;
  document.getElementById('inp-appid').value = a.appid;
  document.getElementById('inp-secret').value = a.appsecret || '';
  document.getElementById('inp-backend').value = a.backend || 'http://localhost:3000';
  document.getElementById('btn-save').textContent = '更新';
  document.getElementById('sheet-overlay').classList.add('open');
}

function closeSheet() { document.getElementById('sheet-overlay').classList.remove('open'); }
function closeSheetOutside(e) { if (e.target.id==='sheet-overlay') closeSheet(); }

function openPicker() {
  const list = document.getElementById('picker-list');
  list.innerHTML = accounts.map((a,i) => {
    const [bg,fg] = getColor(i);
    const isSel = selectedAcct === a;
    return `<div class="picker-item" onclick="selectAccount(${i})">
      <div class="avatar" style="background:${bg};color:${fg}">${a.name[0]}</div>
      <div class="pinfo">
        <div class="pname">${escHtml(a.name)}</div>
        <div class="paid">${escHtml(a.appid)}</div>
      </div>
      <svg class="check-icon ${isSel?'visible':''}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  }).join('');
  document.getElementById('picker-overlay').classList.add('open');
}

function closePickerOutside(e) { if (e.target.id==='picker-overlay') document.getElementById('picker-overlay').classList.remove('open'); }

function selectAccount(i) {
  selectedAcct = accounts[i];
  document.getElementById('picker-overlay').classList.remove('open');
  renderSelector();
}

// ── Save / delete accounts ─────────────────────────────────────────
async function saveAccount() {
  const name = document.getElementById('inp-name').value.trim();
  const appid = document.getElementById('inp-appid').value.trim();
  const appsecret = document.getElementById('inp-secret').value.trim();
  const backend = document.getElementById('inp-backend').value.trim().replace(/\/$/, '');

  if (!name) { showToast('请填写公众号名称', 'error'); return; }
  if (!appid || !appid.startsWith('wx')) { showToast('AppID 格式不对，应以 wx 开头', 'error'); return; }
  if (!appsecret) { showToast('请填写 AppSecret', 'error'); return; }
  if (!backend) { showToast('请填写后端地址', 'error'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';

  try {
    const res = await fetch(`${backend}/api/verify`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appid, appsecret })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '验证失败');

    const entry = { name, appid, appsecret, backend };
    if (editingIdx >= 0) {
      accounts[editingIdx] = entry;
    } else {
      accounts.push(entry);
    }
    saveAccounts();
    if (!selectedAcct || editingIdx === 0) selectedAcct = accounts[0];
    renderSelector();
    renderConfig();
    closeSheet();
    showToast(editingIdx >= 0 ? '已更新' : '添加成功，凭据验证通过 ✓', 'success');
  } catch (e) {
    showToast('验证失败：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = editingIdx >= 0 ? '更新' : '保存';
  }
}

function deleteAccount(i) {
  if (!confirm(`确定删除「${accounts[i].name}」？`)) return;
  if (selectedAcct === accounts[i]) selectedAcct = accounts[0] || null;
  accounts.splice(i, 1);
  saveAccounts();
  renderSelector();
  renderConfig();
  showToast('已删除');
}

// ── Cover image ────────────────────────────────────────────────────
function handleFile(input) {
  const f = input.files[0];
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { showToast('图片不能超过 10MB', 'error'); return; }
  coverFile = f;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('cover-img').src = e.target.result;
    document.getElementById('cover-drop').style.display = 'none';
    document.getElementById('cover-preview').style.display = 'block';
  };
  reader.readAsDataURL(f);
}

function removeCover() {
  coverFile = null;
  document.getElementById('file-input').value = '';
  document.getElementById('cover-drop').style.display = 'flex';
  document.getElementById('cover-preview').style.display = 'none';
}

// ── Publish mode ───────────────────────────────────────────────────
function selectMode(m) {
  publishMode = m;
  document.getElementById('mode-draft').classList.toggle('selected', m==='draft');
  document.getElementById('mode-mass').classList.toggle('selected', m==='mass');
}

// ── Char count ────────────────────────────────────────────────────
function countChars() {
  const n = document.getElementById('art-content').value.length;
  document.getElementById('char-count').textContent = n.toLocaleString() + ' 字';
}

// ── Progress UI ───────────────────────────────────────────────────
let steps = [];

function initSteps(labels) {
  steps = labels.map((label, i) => ({ label, status: 'wait', msg: '' }));
  renderSteps();
  document.getElementById('progress-wrap').classList.add('visible');
}

function setStep(i, status, msg='') {
  steps[i] = { ...steps[i], status, msg };
  renderSteps();
}

function renderSteps() {
  const icons = { wait: '○', running: '…', done: '✓', err: '✗' };
  document.getElementById('step-list').innerHTML = steps.map((s,i) => `
    <div class="step-item">
      <div class="step-dot ${s.status}">${icons[s.status]}</div>
      <div class="step-info">
        <div class="step-name">${s.label}</div>
        ${s.msg ? `<div class="step-msg ${s.status==='err'?'err':''}">${escHtml(s.msg)}</div>` : ''}
      </div>
    </div>`).join('');
}

// ── Publish ───────────────────────────────────────────────────────
async function doPublish() {
  if (!selectedAcct) { showToast('请先配置并选择一个公众号', 'error'); switchTab('config'); return; }
  const title = document.getElementById('art-title').value.trim();
  const content = document.getElementById('art-content').value.trim();
  const author = document.getElementById('art-author').value.trim();
  const digest = document.getElementById('art-digest').value.trim();

  if (!title) { showToast('请填写文章标题', 'error'); return; }
  if (!content) { showToast('请填写正文内容', 'error'); return; }

  const btn = document.getElementById('btn-pub');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> 发布中…';

  const stepLabels = ['上传封面图片', '创建图文草稿'];
  if (publishMode === 'mass') stepLabels.push('群发推送');
  else stepLabels.push('提交发布审核');
  initSteps(stepLabels);

  const { appid, appsecret, backend } = selectedAcct;

  try {
    // Step 0: Upload cover
    let thumb_media_id = '';
    setStep(0, 'running', '上传中…');
    if (coverFile) {
      const form = new FormData();
      form.append('appid', appid);
      form.append('appsecret', appsecret);
      form.append('image', coverFile);
      const res = await fetch(`${backend}/api/upload-image`, { method: 'POST', body: form });
      const data = await res.json();
      if (!data.ok) throw { step: 0, msg: data.error || '上传失败' };
      thumb_media_id = data.media_id;
      setStep(0, 'done', `media_id: ${thumb_media_id.slice(0,16)}…`);
    } else {
      setStep(0, 'done', '未上传封面，跳过');
    }

    // Step 1: Create draft
    setStep(1, 'running', '创建草稿…');
    const draftRes = await fetch(`${backend}/api/draft`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appid, appsecret, title, content, author, digest, thumb_media_id })
    });
    const draftData = await draftRes.json();
    if (!draftData.ok) throw { step: 1, msg: draftData.error || '草稿创建失败' };
    const draftMediaId = draftData.media_id;
    setStep(1, 'done', `草稿 ID: ${draftMediaId.slice(0,16)}…`);

    // Step 2: Publish or mass send
    setStep(2, 'running', publishMode === 'mass' ? '群发中…' : '提交审核…');
    const endpoint = publishMode === 'mass' ? `${backend}/api/masssend` : `${backend}/api/publish`;
    const pubRes = await fetch(endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appid, appsecret, media_id: draftMediaId })
    });
    const pubData = await pubRes.json();
    if (!pubData.ok) throw { step: 2, msg: pubData.error || '发布失败' };
    setStep(2, 'done', publishMode === 'mass' ? '已成功群发 🎉' : '已进入发布审核 ✓');
    showToast(publishMode === 'mass' ? '群发成功！' : '已保存并提交审核！', 'success');

  } catch (e) {
    if (e && e.step !== undefined) {
      setStep(e.step, 'err', e.msg);
      // Mark remaining steps as wait
      for (let i = e.step + 1; i < steps.length; i++) setStep(i, 'wait', '已跳过');
      showToast('发布失败：' + e.msg, 'error');
    } else {
      showToast('网络错误：' + (e.message || e), 'error');
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg> 重新发布`;
  }
}

// ── Toast ──────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Init ──────────────────────────────────────────────────────────
renderSelector();
renderConfig();
</script>
